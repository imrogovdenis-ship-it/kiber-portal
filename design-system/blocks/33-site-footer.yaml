schema_version: 1
id: site-footer
review_id: "33"
name: Site Footer
status: stable
component: src/components/layout/Footer.astro
used_in: [all-public-pages, design-review]
variants: [default]
tokens:
  surface: "{color.footer.background}"
  foreground: "{color.ink.inverse}"
  muted: "{color.text.subtle}"
  action: "{color.action.rest}"
content_contract:
  required: [logo_label, description, sections, phone, email, messengers, legal_notice, legal_links]
  optional: []
  rules:
    - contacts and legal links remain usable without JavaScript
    - published contacts are sourced from validated public config
    - left brand text does not repeat the region; address renders as `г. Москва, Нижний Сусальный переулок, 9, стр. 4А`
    - description renders as two lines and requisites render below it as three lines
    - footer removes the separate Content column and renders one muted page-link list
    - visible footer page links are Главное, Каталог, Подборки, Блог, Новости and Контакты; no visible `Меню` title is rendered
    - "owner approved footer visual direction on 2026-08-31: Футер утверждаю; approval scope excludes PR merge, production deploy, DNS, secrets, analytics and live lead routing"
responsive:
  sm: { columns: 1 }
  md: { columns: 2 }
  lg: { columns: 4 }
  xl: { columns: 4 }
accessibility:
  landmark: contentinfo
  image_alt_required: false
  full_card_link: false
  focus_visible: true
analytics:
  events: [phone_click, contact_click]
fixtures: [default, long-content, minimal, missing-optional, mobile]
traceability:
  - { source: docs/source/reference-desktop-v9.html, locator: 'data-rv="33 · FOOTER"; .site-footer' }
  - { source: docs/source/reference-mobile-v3.html, locator: 'data-rv="33"; .site-footer' }
  - { source: docs/DESIGN-SYSTEM-TZ.md, locator: Header/Footer/Breadcrumbs }
