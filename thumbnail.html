<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Кибер Портал</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: var(--kp-white); margin: 0; }
  .t { width: 520px; padding: 40px; display: flex; flex-direction: column; gap: 22px; }
  .strip { display: flex; height: 44px; border-radius: 10px; overflow: hidden; }
  .strip > div { flex: 1; }
</style>
</head><body>
<div class="t">
  <img src="assets/logo.svg" alt="Кибер Портал" style="width:200px">
  <h1 class="kp-h2">Аренда роботов</h1>
  <div class="strip">
    <div style="background:#0088FF"></div>
    <div style="background:#005EFF"></div>
    <div style="background:#F4F8FF"></div>
    <div style="background:#25222B"></div>
    <div style="background:#797A91"></div>
  </div>
  <div style="display:flex;gap:10px">
    <span class="kp-btn kp-btn--primary kp-btn--sm">Оставить заявку</span>
    <span class="kp-btn kp-btn--secondary kp-btn--sm">Каталог</span>
  </div>
</div>
</body></html>
