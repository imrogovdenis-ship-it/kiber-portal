name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Generated files are current
        run: git diff --exit-code -- src/styles/tokens.css src/generated docs/generated
      - name: Production excludes design review
        run: test ! -e dist/preview/design-review/index.html
