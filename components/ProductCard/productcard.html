<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ProductCard</title>
<link rel="stylesheet" href="../../styles.css">
</head><body>
<section class="kp-section kp-section--tint">
  <div class="kp-container">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-5)">

      <a href="#" class="kp-card kp-card--outline" style="text-decoration:none;display:block">
        <img class="kp-card__media" src="../../assets/robot-humanoid.jpg" alt="AgiBot X2">
        <div class="kp-card__body">
          <span class="kp-tag" style="align-self:flex-start">Гуманоид</span>
          <h3 class="kp-h3">AgiBot X2</h3>
          <p class="kp-body">Ходит, говорит, ведёт программу мероприятия.</p>
          <p class="kp-stat" style="font-size:22px;margin-top:var(--s-1)">от 120 000 руб.</p>
        </div>
      </a>

      <a href="#" class="kp-card kp-card--tint" style="text-decoration:none;display:block">
        <img class="kp-card__media" src="../../assets/hero-cover.jpg" alt="Unitree Go2">
        <div class="kp-card__body">
          <span class="kp-tag kp-tag--solid" style="align-self:flex-start">Хит</span>
          <h3 class="kp-h3">Unitree Go2</h3>
          <p class="kp-body">Робот-собака для шоу и фотозоны. Оператор включён в стоимость.</p>
          <p class="kp-stat" style="font-size:22px;margin-top:var(--s-1)">от 45 000 руб.</p>
        </div>
      </a>

      <a href="#" class="kp-card kp-card--dark" style="text-decoration:none;display:block">
        <div class="kp-card__body kp-on-dark" style="min-height:100%">
          <span class="kp-tag kp-tag--amber" style="align-self:flex-start">Под ключ</span>
          <h3 class="kp-h3">Сценарий и монтаж</h3>
          <p class="kp-body">Пишем программу под площадку, привозим, настраиваем и ведём весь день.</p>
        </div>
      </a>

    </div>
  </div>
</section>
</body></html>
